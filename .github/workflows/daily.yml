name: Auto Daily Macro Update

on:
  push:
    paths:
      - 'update_data.py'
      - '.github/workflows/**'
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装全部计算与时序依赖
        run: pip install pandas numpy matplotlib

      - name: 执行高精真实数据生成脚本
        run: python update_data.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update macro dashboard: $(date +'%Y-%m-%d')" && git push)
